<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics | Network Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="container">
<h1>گزارش سیستم</h1>
<div class="grid">
  <div class="card"><h2 id="total">0</h2><p>تعداد درخواست ها</p></div>
  <div class="card"><h2>24/7</h2><p>پشتیبانی فنی</p></div>
  <div class="card"><h2>99%</h2><p>پایداری سیستم</p></div>
</div>
</section>
<script>
(async()=>{
  try{
    const me=await fetch("/api/auth/me",{credentials:"same-origin"});
    if(!me.ok) throw new Error();
    const r=await fetch("/api/request/",{credentials:"same-origin"});
    if(!r.ok) throw new Error();
    const data=await r.json();
    document.getElementById("total").textContent=data.requests.length;
  }catch{
    window.location.href="admin.html";
  }
})();
</script>
</body>
</html>
