# Panther IKEv2 production template
# Fixed Panther LAN: 192.168.1.111
# Current observed public IPv4: 5.127.143.74

config setup
    uniqueids=never

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-modp2048,aes128-sha256-modp2048
    esp=aes256-sha256,aes128-sha256
    dpdaction=clear
    dpddelay=30s
    rekey=yes
    fragmentation=yes
    forceencaps=yes
    mobike=yes

conn panther-ikev2
    auto=add
    left=%defaultroute
    leftid=192.168.1.111
    leftcert=panther-server-cert.pem
    leftsendcert=always
    leftsubnet=0.0.0.0/0
    right=%any
    rightauth=eap-mschapv2
    rightsourceip=10.250.0.0/24
    rightdns=1.1.1.1,1.0.0.1
    type=tunnel
    compress=no
