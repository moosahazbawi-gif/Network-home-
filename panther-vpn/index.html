<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PX2.VPN — تجربة 3 أيام</title><link rel="stylesheet" href="../style.css"></head>
<body><nav class="navbar"><a class="logo" href="../index.html">PX2 <span>• VPN</span></a><ul><li><a href="../index.html">الرئيسية</a></li><li><a href="../services.html">الخدمات</a></li></ul><a class="nav-btn" href="../contact.html">الدعم</a></nav>
<header class="hero compact-hero"><div class="hero-content"><div class="eyebrow">PX2.VPN / PANTHER</div><h1>VPN مجاني لمدة 3 أيام.</h1><p>ابدأ التجربة، ثم فعّل الخدمة مقابل <strong>$2</strong> لمدة سنة كاملة.</p></div></header>
<section><div class="auth-card card"><div class="eyebrow">START FREE TRIAL</div><h2>ابدأ تجربة PX2.VPN</h2><p class="muted">استخدم بريدك الإلكتروني لإدارة مدة التجربة وحالة التفعيل.</p>
<form id="vpnForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button class="btn primary" type="submit">ابدأ 3 أيام مجانًا</button></form>
<hr class="soft-rule"><div id="status" class="form-status" aria-live="polite"></div><button id="activate" class="btn primary" type="button" hidden>تفعيل سنة كاملة — $2</button></div></section>
<footer><p>© Network Home — PX2.VPN</p></footer>
<script>
let csrfToken=""; const statusEl=document.getElementById("status"), activateBtn=document.getElementById("activate"), emailEl=document.getElementById("email");
async function csrf(){const r=await fetch("../api/vpn/csrf",{credentials:"include"}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر تهيئة الحماية");csrfToken=d.csrfToken;}
function fmt(v){return v?new Date(v).toLocaleString("ar",{dateStyle:"medium",timeStyle:"short"}):"—";}
function show(d){if(d.state==="trial"){statusEl.className="form-status success";statusEl.textContent="التجربة فعالة حتى "+fmt(d.trialEndsAt)+".";activateBtn.hidden=false;}else if(d.state==="active"){statusEl.className="form-status success";statusEl.textContent="الخدمة مفعلة حتى "+fmt(d.activeUntil)+".";activateBtn.hidden=true;}else if(d.state==="expired"){statusEl.className="form-status error";statusEl.textContent="انتهت التجربة. فعّل الخدمة مقابل $2.";activateBtn.hidden=false;}else{statusEl.textContent="جاهز لبدء التجربة.";activateBtn.hidden=true;}}
document.getElementById("vpnForm").addEventListener("submit",async e=>{e.preventDefault();statusEl.textContent="جارٍ تفعيل التجربة…";try{await csrf();const r=await fetch("../api/vpn/trial",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({email:emailEl.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر بدء التجربة");show(d);}catch(err){statusEl.className="form-status error";statusEl.textContent=err.message;}});
activateBtn.addEventListener("click",async()=>{activateBtn.disabled=true;try{if(!csrfToken)await csrf();const r=await fetch("../api/vpn/checkout",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({email:emailEl.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر إنشاء الدفع");location.href=d.url;}catch(err){statusEl.className="form-status error";statusEl.textContent=err.message;activateBtn.disabled=false;}});
</script></body></html>
