version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloudbell_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudbell
      POSTGRES_PASSWORD: strong_password_here
      POSTGRES_DB: cloudbell_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - cloudbell_net
    # پورت به هاست بایند نمی‌شود تا تداخل ایجاد نکند

  redis:
    image: redis:7-alpine
    container_name: cloudbell_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - cloudbell_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbell_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://cloudbell:strong_password_here@db:5432/cloudbell_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change_this_to_a_secure_random_key
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    volumes:
      - downloads_data:/app/downloads
    networks:
      - cloudbell_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbell_worker
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://cloudbell:strong_password_here@db:5432/cloudbell_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - downloads_data:/app/downloads
    networks:
      - cloudbell_net

  nginx:
    image: nginx:alpine
    container_name: cloudbell_web
    restart: unless-stopped
    ports:
      - "8090:80"  # پورت 8090 بیرون وصل می‌شود به پورت 80 داخل این کانتینر
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - cloudbell_net

volumes:
  db_data:
  redis_data:
  downloads_data:

networks:
  cloudbell_net:
    driver: bridge
