name: Docker integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-home:
    name: Network Home
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-network-home-db-password-2026
      SESSION_SECRET: ci-network-home-session-secret-2026-long-enough
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-network-home-admin-password-2026
      CORS_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f docker-compose.panther.yml config

      - name: Build and start
        run: docker compose -f docker-compose.panther.yml up -d --build

      - name: Show services
        if: always()
        run: docker compose -f docker-compose.panther.yml ps

      - name: Check frontend
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.panther.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.panther.yml down -v

  cloudbell:
    name: CloudBell Pro
    needs: network-home
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        working-directory: cloudbell-pro
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".env")
          s = p.read_text()
          replacements = {
              "SECRET_KEY=change-me-with-openssl": "SECRET_KEY=ci-cloudbell-secret-key-2026",
              "POSTGRES_PASSWORD=change-me-with-openssl": "POSTGRES_PASSWORD=ci-cloudbell-db-password-2026",
              "DATABASE_URL=postgresql+psycopg2://cloudbell:change-me-with-openssl@postgres:5432/cloudbell": "DATABASE_URL=postgresql+psycopg2://cloudbell:ci-cloudbell-db-password-2026@postgres:5432/cloudbell",
              "BOOTSTRAP_ADMIN_PASSWORD=change-me-now": "BOOTSTRAP_ADMIN_PASSWORD=ci-cloudbell-admin-password-2026",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Validate Compose
        working-directory: cloudbell-pro
        run: docker compose config

      - name: Build and start
        working-directory: cloudbell-pro
        run: docker compose up -d --build

      - name: Show services
        if: always()
        working-directory: cloudbell-pro
        run: docker compose ps

      - name: Check frontend
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8088/healthz

      - name: Logs on failure
        if: failure()
        working-directory: cloudbell-pro
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        working-directory: cloudbell-pro
        run: docker compose down -v
